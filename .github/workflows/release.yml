name: D1 candidate package
on:
  push:
    tags: ['v*-d1*']
permissions:
  contents: read
jobs:
  candidate:
    runs-on: macos-26
    timeout-minutes: 45
    permissions:
      contents: write
      id-token: write
      attestations: write
    env:
      GOTOOLCHAIN: local
      GOPROXY: 'off'
      GOSUMDB: 'off'
      GOFLAGS: -mod=readonly
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: '1.27.1'
          check-latest: false
          cache: false
      - name: Prepare verified build/test tools
        run: python3 packaging/prepare-ci.py "$RUNNER_TEMP/atlas-ci-tools"
      - name: Locked quality gates
        run: |
          "$RUNNER_TEMP/atlas-ci-tools/task" quality \
            PLATFORM_HELM="$RUNNER_TEMP/atlas-ci-tools/helm" \
            PLATFORM_KUBECTL="$RUNNER_TEMP/atlas-ci-tools/kubectl" \
            PLATFORM_YQ="$RUNNER_TEMP/atlas-ci-tools/yq" \
            PLATFORM_LUA="$RUNNER_TEMP/atlas-ci-tools/lua" \
            KUBESEAL="$RUNNER_TEMP/atlas-ci-tools/kubeseal"
      - name: Build exactly once from the tagged clean commit
        run: |
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          go run ./cmd/atlas-release --version "$GITHUB_REF_NAME" \
            --tool-dir "$RUNNER_TEMP/atlas-ci-tools" --output "$RUNNER_TEMP/atlas-dist"
      - name: Attest the complete archive
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-path: ${{ runner.temp }}/atlas-dist/*.tar.gz
      - name: Create draft candidate; second-machine acceptance precedes promotion
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" --verify-tag --draft --prerelease \
            --title "Atlas D1 candidate $GITHUB_REF_NAME" \
            --notes-file packaging/release-notes.md \
            "$RUNNER_TEMP/atlas-dist/atlas-$GITHUB_REF_NAME-darwin-arm64.tar.gz" \
            "$RUNNER_TEMP/atlas-dist/atlas-$GITHUB_REF_NAME-darwin-arm64.tar.gz.sha256"
