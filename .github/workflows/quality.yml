name: Quality
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  quality:
    runs-on: macos-26
    timeout-minutes: 45
    env:
      GOTOOLCHAIN: local
      GOPROXY: 'off'
      GOSUMDB: 'off'
      GOFLAGS: -mod=readonly
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: '1.27.1'
          check-latest: false
          cache: false
      - name: Prepare checksum-locked tools
        run: python3 packaging/prepare-ci.py "$RUNNER_TEMP/atlas-ci-tools"
      - name: Validate source, contracts and actual renders
        run: |
          "$RUNNER_TEMP/atlas-ci-tools/task" quality \
            PLATFORM_HELM="$RUNNER_TEMP/atlas-ci-tools/helm" \
            PLATFORM_KUBECTL="$RUNNER_TEMP/atlas-ci-tools/kubectl" \
            PLATFORM_YQ="$RUNNER_TEMP/atlas-ci-tools/yq" \
            PLATFORM_LUA="$RUNNER_TEMP/atlas-ci-tools/lua" \
            KUBESEAL="$RUNNER_TEMP/atlas-ci-tools/kubeseal"
      - name: Build local Web OCI artifact twice
        run: |
          CGO_ENABLED=0 GOOS=linux GOARCH=arm64 go build -trimpath -buildvcs=false \
            -ldflags=-buildid= -o "$RUNNER_TEMP/atlas-web" ./cmd/atlas-web
          go run ./cmd/atlas-web-image --binary "$RUNNER_TEMP/atlas-web" --out "$RUNNER_TEMP/first.oci.tar"
          go run ./cmd/atlas-web-image --binary "$RUNNER_TEMP/atlas-web" --out "$RUNNER_TEMP/second.oci.tar"
          cmp "$RUNNER_TEMP/first.oci.tar" "$RUNNER_TEMP/second.oci.tar"
