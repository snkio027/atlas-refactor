version: '3'

env:
  GOTOOLCHAIN: local
  GOPROXY: 'off'
  GOSUMDB: 'off'
  GOFLAGS: -mod=readonly

tasks:
  toolchain:
    cmds:
      - test "$(go env GOVERSION)" = "go1.27.1"
  check:
    cmds:
      - task: toolchain
      - test -z "$(gofmt -l cmd internal)"
      - go vet ./...
  test:
    cmds:
      - task: toolchain
      - go test -race ./...
  quality:
    env:
      ATLAS_TEST_LUA: '{{.PLATFORM_LUA | default "lua"}}'
    cmds:
      - task: check
      - task: test
      - task: platform:check
  build:
    cmds:
      - task: toolchain
      - mkdir -p bin
      - env CGO_ENABLED=0 go build -trimpath -o bin/atlas ./cmd/atlas
      - env CGO_ENABLED=0 go build -trimpath -o bin/atlas-dev ./cmd/atlas-dev
      - env CGO_ENABLED=0 go build -trimpath -o bin/atlas-artifacts ./cmd/atlas-artifacts
  build:matrix:
    cmds:
      - task: toolchain
      - mkdir -p bin
      - env CGO_ENABLED=0 GOOS=darwin GOARCH=arm64 go build -trimpath -o bin/atlas-darwin-arm64 ./cmd/atlas
      - env CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -trimpath -o bin/atlas-linux-amd64 ./cmd/atlas
      - env CGO_ENABLED=0 GOOS=linux GOARCH=arm64 go build -trimpath -o bin/atlas-linux-arm64 ./cmd/atlas
  platform:plan:
    desc: Show capability dependency closure and missing sealed credentials; no cluster operations
    cmds:
      - go run ./cmd/atlas-platform --capabilities '{{.CAPABILITIES | default "monitoring,object-storage,storage-monitoring"}}' plan
  platform:select:
    desc: Select capabilities in the local worktree only; never publishes or applies
    cmds:
      - go run ./cmd/atlas-platform --capabilities '{{.CAPABILITIES}}' select
  platform:credentials:
    desc: Seal locally generated credentials using a reviewed public certificate
    cmds:
      - go run ./cmd/atlas-platform --cert '{{.CERT}}' --kubeseal '{{.KUBESEAL | default "kubeseal"}}' prepare-credentials
  platform:render:
    desc: Render the development candidate locally; never contacts a cluster
    cmds:
      - task: toolchain
      - go run ./cmd/atlas-platform --helm '{{.PLATFORM_HELM | default "helm"}}' --kubectl '{{.PLATFORM_KUBECTL | default "kubectl"}}' --yq '{{.PLATFORM_YQ | default "yq"}}' render
      - go run ./cmd/atlas render --config profiles/development.json --output .
  platform:check:
    desc: Check local renders, Kustomize, schemas and architecture boundaries
    cmds:
      - task: toolchain
      - go run ./cmd/atlas-platform --helm '{{.PLATFORM_HELM | default "helm"}}' --kubectl '{{.PLATFORM_KUBECTL | default "kubectl"}}' --yq '{{.PLATFORM_YQ | default "yq"}}' check
